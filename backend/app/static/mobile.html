<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10231F">
<title>FoydaPay</title>
<style>
:root{
  --bg:#F3F6F5; --card:#FFFFFF; --text:#14231F; --muted:#56665F; --line:#D8E1DD;
  --brand:#10231F; --on-brand:#EEF3EF; --on-brand-muted:#B9CCC5;
  --accent:#17775A; --accent-soft:#E3EEE9; --on-accent:#FFFFFF;
  --warn:#9A4C0E; --warn-soft:#FBEBDD; --bad:#B42318; --bad-soft:#FDECEA;
  --c-loan:#C2410C; --c-pay:#17775A; --c-job:#2563EB; --c-bank:#7C3AED; --c-rem:#B45309; --c-bill:#64748B;
  --radius:16px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --card:#17211E; --text:#E4ECE8; --muted:#9AABA5; --line:#2B3A35;
  --brand:#0A1210; --on-brand:#E4ECE8; --on-brand-muted:#9AABA5;
  --accent:#3CC29A; --accent-soft:#173A2F; --on-accent:#0E1513;
  --warn:#F2B36B; --warn-soft:#3A2A16; --bad:#FF8A80; --bad-soft:#3B1D1B;
  --c-loan:#FB923C; --c-pay:#3CC29A; --c-job:#60A5FA; --c-bank:#A78BFA; --c-rem:#FBBF24; --c-bill:#94A3B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --card:#17211E; --text:#E4ECE8; --muted:#9AABA5; --line:#2B3A35;
  --brand:#0A1210; --on-brand:#E4ECE8; --on-brand-muted:#9AABA5;
  --accent:#3CC29A; --accent-soft:#173A2F; --on-accent:#0E1513;
  --warn:#F2B36B; --warn-soft:#3A2A16; --bad:#FF8A80; --bad-soft:#3B1D1B;
  --c-loan:#FB923C; --c-pay:#3CC29A; --c-job:#60A5FA; --c-bank:#A78BFA; --c-rem:#FBBF24; --c-bill:#94A3B8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
.phone{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:600px){body{background:#C9D3CF}.phone{min-height:100vh;box-shadow:0 0 0 1px var(--line)}}
@media (min-width:600px) and (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:#050807}}
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
section[data-tab]{display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0} h2{font-size:22px} h3{font-size:17px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--brand);color:var(--on-brand);border:0}
.hero .muted{color:var(--on-brand-muted)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;min-width:2.2em;text-align:center}
.big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;background:var(--accent-soft);color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:var(--on-accent)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.link{background:none;padding:4px 0;color:var(--accent);font-weight:600}
button.icon{background:transparent;padding:8px;border-radius:10px;color:var(--text);display:inline-flex}
button.icon svg{width:22px;height:22px}
button.block{width:100%}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
.ok{background:var(--accent-soft);color:var(--accent)} .warn{background:var(--warn-soft);color:var(--warn)} .bad{background:var(--bad-soft);color:var(--bad)}
.banner{border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:4px}
.tip{background:var(--accent-soft);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.list li span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.list li span:only-child{font-weight:400;white-space:normal}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.topbar{display:flex;align-items:center;gap:6px;margin:-4px 0 -4px -8px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:12px;font-weight:600}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--accent)}
.ring{width:96px;height:96px;flex:none}
a{color:var(--accent)}
.hero a{color:var(--on-brand)}
.hero button.ghost{color:var(--on-brand);border-color:rgba(255,255,255,.3)}
/* tiles on Home */
.tile{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--text);font-weight:400}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:16px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.ev{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.date{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--bg);padding:4px 0;line-height:1.1}
.date b{display:block;font-size:18px} .date span{font-size:11px;color:var(--muted);text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.k-loan{background:var(--c-loan)} .k-payday{background:var(--c-pay)} .k-job{background:var(--c-job)} .k-bank{background:var(--c-bank)} .k-rem{background:var(--c-rem)} .k-bill{background:var(--c-bill)}
.k-planned{background:transparent;border:2px dashed var(--c-job)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.cal button{background:transparent;color:var(--text);padding:6px 0 4px;border-radius:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:7px;height:7px;border-radius:50%}
.cal .dots i.k-planned{border-width:1.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* chat */
section[data-tab="chat"]{min-height:calc(100vh - 130px)}
.chat-head{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:4px 0 8px;z-index:2;border-bottom:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;flex:none}
.avatar.sm{width:28px;height:28px;font-size:13px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-pay)}
.msgs{display:flex;flex-direction:column;gap:12px;flex:1}
.mrow{display:flex;gap:8px;align-items:flex-end}
.mrow.user{justify-content:flex-end}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.mrow.user .msg{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.mrow.agent .msg{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg time{display:block;font-size:11px;opacity:.65;margin-top:4px}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4}
@media (prefers-reduced-motion: no-preference){.typing i{animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}}
.actioncard{border:1px solid var(--accent);background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;max-width:88%}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:8px}
.composer textarea{min-height:46px;max-height:140px;border-radius:22px;padding:12px 16px;resize:none}
.composer button{border-radius:50%;width:46px;height:46px;padding:0;display:grid;place-items:center;flex:none}
.composer button svg{width:20px;height:20px}
/* overlays */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:30;background:var(--brand);color:var(--on-brand);padding:12px 16px;border-radius:14px;max-width:min(408px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tier{font:700 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--accent)}
pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace;background:var(--bg);border-radius:12px;padding:12px;margin:0}
@media (prefers-reduced-motion: no-preference){.card,.banner{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}

/* onboarding */
.ob{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.logo{font-size:30px;font-weight:800;letter-spacing:-.02em}
.logo b{color:var(--accent)}
.langbtn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;color:var(--text);font-size:19px;text-align:left}
.langbtn span{font:800 14px/1 ui-monospace,Consolas,monospace;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 0;width:46px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.flag{width:34px;height:24px;border-radius:4px;flex:none;box-shadow:0 0 0 1px var(--line)}
/* guided tour */
.tour-spot{position:fixed;z-index:40;border-radius:16px;pointer-events:none;box-shadow:0 0 0 200vmax rgba(5,12,10,.66);transition:all .45s cubic-bezier(.3,.7,.2,1);outline:3px solid #4CC495;outline-offset:2px}
.tour-block{position:fixed;inset:0;z-index:39}
.tour-arrow{position:fixed;z-index:41;width:44px;height:52px;pointer-events:none;color:#4CC495;transition:left .45s,top .45s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.tour-arrow svg{width:100%;height:100%}
@media (prefers-reduced-motion: no-preference){.tour-arrow.down svg{animation:bob 1s ease-in-out infinite}.tour-arrow.up svg{animation:bobup 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(8px)}}@keyframes bobup{50%{transform:translateY(-8px)}}
  .tour-card{animation:pop .3s ease-out}@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}}
.tour-card{position:fixed;z-index:42;left:50%;transform:translateX(-50%);width:min(408px,calc(100% - 24px));background:var(--card);color:var(--text);border-radius:18px;padding:14px 14px 12px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
.tour-card.top{top:12px}.tour-card.bottom{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.tour-card p{font-size:16px;line-height:1.45}
.tour-dots{display:flex;gap:4px}.tour-dots i{flex:1;height:3px;border-radius:2px;background:var(--line)}.tour-dots i.on{background:var(--accent)}
.tour-ctl{display:flex;gap:8px;align-items:center}
.tour-ctl button{padding:9px 12px}
.badge{font:700 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);padding:5px 8px;border-radius:999px;align-self:flex-start}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion: no-preference){.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}}
.job{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.job:first-of-type{border-top:0}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--accent)}
.langs{display:inline-flex;gap:4px}
.langs button{padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<div class="phone">
<main>
<section data-tab="welcome" hidden></section>
<section data-tab="home" id="home"></section>
<section data-tab="check" hidden>
  <div class="steps" id="stepBar"></div>
  <div id="stepBody"></div>
  <div class="row" id="stepNav">
    <button class="ghost" id="backBtn"></button>
    <button class="primary" id="nextBtn" style="flex:1"></button>
  </div>
</section>
<section data-tab="plan" hidden></section>
<section data-tab="calendar" hidden></section>
<section data-tab="security" hidden></section>
<section data-tab="chat" hidden>
  <div class="chat-head" data-tour="chathead">
    <div class="avatar" aria-hidden="true">F</div>
    <div class="grow"><b>FoydaPay AI</b><div class="status" id="modeBadge"></div></div>
    <button class="icon" id="histBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
    <button class="icon" id="newChatBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="composer" id="chatForm" data-tour="composer">
    <label for="q" id="qLabel" style="position:absolute;left:-9999px">Message</label>
    <textarea id="q" rows="1" maxlength="1000"></textarea>
    <button class="primary" type="submit" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</section>
</main>
<nav aria-label="Main" id="nav">
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav_home"></span></button>
  <button data-go="check" data-tour="navcheck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span data-t="nav_check"></span></button>
  <button data-go="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span data-t="nav_chat"></span></button>
</nav>
</div>
<script src="/static/i18n.js"></script>
<script src="/static/mobile.js"></script>
</body>
</html>
