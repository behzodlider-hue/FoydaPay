<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10231F">
<title>FoydaPay</title>
<style>
:root{
  --bg:#F3F6F5; --card:#FFFFFF; --text:#14231F; --muted:#56665F; --line:#D8E1DD;
  --brand:#10231F; --on-brand:#EEF3EF; --on-brand-muted:#B9CCC5;
  --accent:#17775A; --accent-soft:#E3EEE9; --on-accent:#FFFFFF;
  --warn:#9A4C0E; --warn-soft:#FBEBDD; --bad:#B42318; --bad-soft:#FDECEA;
  --c-loan:#C2410C; --c-pay:#17775A; --c-job:#2563EB; --c-bank:#7C3AED; --c-rem:#B45309; --c-bill:#64748B;
  --radius:16px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --card:#17211E; --text:#E4ECE8; --muted:#9AABA5; --line:#2B3A35;
  --brand:#0A1210; --on-brand:#E4ECE8; --on-brand-muted:#9AABA5;
  --accent:#3CC29A; --accent-soft:#173A2F; --on-accent:#0E1513;
  --warn:#F2B36B; --warn-soft:#3A2A16; --bad:#FF8A80; --bad-soft:#3B1D1B;
  --c-loan:#FB923C; --c-pay:#3CC29A; --c-job:#60A5FA; --c-bank:#A78BFA; --c-rem:#FBBF24; --c-bill:#94A3B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --card:#17211E; --text:#E4ECE8; --muted:#9AABA5; --line:#2B3A35;
  --brand:#0A1210; --on-brand:#E4ECE8; --on-brand-muted:#9AABA5;
  --accent:#3CC29A; --accent-soft:#173A2F; --on-accent:#0E1513;
  --warn:#F2B36B; --warn-soft:#3A2A16; --bad:#FF8A80; --bad-soft:#3B1D1B;
  --c-loan:#FB923C; --c-pay:#3CC29A; --c-job:#60A5FA; --c-bank:#A78BFA; --c-rem:#FBBF24; --c-bill:#94A3B8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
.phone{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:600px){body{background:#C9D3CF}.phone{min-height:100vh;box-shadow:0 0 0 1px var(--line)}}
@media (min-width:600px) and (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:#050807}}
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
section[data-tab]{display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0} h2{font-size:22px} h3{font-size:17px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--brand);color:var(--on-brand);border:0}
.hero .muted{color:var(--on-brand-muted)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;min-width:2.2em;text-align:center}
.big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;background:var(--accent-soft);color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:var(--on-accent)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
button.link{background:none;padding:4px 0;color:var(--accent);font-weight:600}
button.icon{background:transparent;padding:8px;border-radius:10px;color:var(--text);display:inline-flex}
button.icon svg{width:22px;height:22px}
button.block{width:100%}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
.ok{background:var(--accent-soft);color:var(--accent)} .warn{background:var(--warn-soft);color:var(--warn)} .bad{background:var(--bad-soft);color:var(--bad)}
.banner{border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:4px}
.tip{background:var(--accent-soft);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.list li span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.list li span:only-child{font-weight:400;white-space:normal}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.topbar{display:flex;align-items:center;gap:6px;margin:-4px 0 -4px -8px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:12px;font-weight:600}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--accent)}
.ring{width:96px;height:96px;flex:none}
a{color:var(--accent)}
.hero a{color:var(--on-brand)}
/* tiles on Home */
.tile{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--text);font-weight:400}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:16px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.ev{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.date{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--bg);padding:4px 0;line-height:1.1}
.date b{display:block;font-size:18px} .date span{font-size:11px;color:var(--muted);text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.k-loan{background:var(--c-loan)} .k-payday{background:var(--c-pay)} .k-job{background:var(--c-job)} .k-bank{background:var(--c-bank)} .k-rem{background:var(--c-rem)} .k-bill{background:var(--c-bill)}
.k-planned{background:transparent;border:2px dashed var(--c-job)}
/* calendar */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{background:transparent;color:var(--muted);padding:9px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.cal button{background:transparent;color:var(--text);padding:6px 0 4px;border-radius:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:46px}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:7px;height:7px;border-radius:50%}
.cal .dots i.k-planned{border-width:1.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.gantt{display:flex;flex-direction:column;gap:8px}
.g-label{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.g-row{display:grid;grid-template-columns:repeat(35,1fr);gap:1px;height:16px}
.g-row i{background:var(--bg);border-radius:2px}
.g-row i.wk{background:color-mix(in srgb,var(--line) 55%,var(--bg))}
.g-row i.now{box-shadow:inset 0 0 0 1px var(--accent)}
.g-row i.k-loan{background:var(--c-loan)} .g-row i.k-payday{background:var(--c-pay)} .g-row i.k-job{background:var(--c-job)} .g-row i.k-bank{background:var(--c-bank)} .g-row i.k-rem{background:var(--c-rem)}
.g-row i.k-planned{background:color-mix(in srgb,var(--c-job) 35%,transparent);border:0}
.g-row i.now{outline:2px solid var(--text);outline-offset:-1px}
.g-head{display:grid;grid-template-columns:repeat(5,1fr);font-size:11px;color:var(--muted)}
/* chat */
section[data-tab="chat"]{min-height:calc(100vh - 130px)}
.chat-head{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:4px 0 8px;z-index:2;border-bottom:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;flex:none}
.avatar.sm{width:28px;height:28px;font-size:13px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-pay)}
.msgs{display:flex;flex-direction:column;gap:12px;flex:1}
.mrow{display:flex;gap:8px;align-items:flex-end}
.mrow.user{justify-content:flex-end}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.mrow.user .msg{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.mrow.agent .msg{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg time{display:block;font-size:11px;opacity:.65;margin-top:4px}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4}
@media (prefers-reduced-motion: no-preference){.typing i{animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}}
.actioncard{border:1px solid var(--accent);background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;max-width:88%}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:8px}
.composer textarea{min-height:46px;max-height:140px;border-radius:22px;padding:12px 16px;resize:none}
.composer button{border-radius:50%;width:46px;height:46px;padding:0;display:grid;place-items:center;flex:none}
.composer button svg{width:20px;height:20px}
/* overlays */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.guide{position:fixed;inset:0;z-index:20;background:var(--brand);color:var(--on-brand);display:flex;justify-content:center}
.guide>div{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.guide video{width:100%;flex:1;min-height:0;object-fit:contain;border-radius:16px;background:#000}
.guide .muted{color:var(--on-brand-muted)}
.guide button.ghost{color:var(--on-brand);border-color:rgba(255,255,255,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:30;background:var(--brand);color:var(--on-brand);padding:12px 16px;border-radius:14px;max-width:min(408px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tier{font:700 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--accent)}
pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace;background:var(--bg);border-radius:12px;padding:12px;margin:0}
@media (prefers-reduced-motion: no-preference){.card,.banner{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="phone">
<main>

<!-- ============ HOME ============ -->
<section data-tab="home" id="home"></section>

<!-- ============ QUICK CHECK ============ -->
<section data-tab="check" hidden>
  <div class="steps" id="stepBar"></div>
  <div id="stepBody"></div>
  <div class="row" id="stepNav">
    <button class="ghost" id="backBtn">Back</button>
    <button class="primary" id="nextBtn" style="flex:1">Next</button>
  </div>
</section>

<!-- ============ PLAN / CALENDAR / SECURITY (opened from Home) ============ -->
<section data-tab="plan" hidden></section>
<section data-tab="calendar" hidden></section>
<section data-tab="security" hidden></section>

<!-- ============ CHAT ============ -->
<section data-tab="chat" hidden>
  <div class="chat-head">
    <div class="avatar" aria-hidden="true">F</div>
    <div class="grow"><b>FoydaPay AI</b><div class="status" id="modeBadge">connecting…</div></div>
    <button class="icon" id="histBtn" aria-label="Chat history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
    <button class="icon" id="newChatBtn" aria-label="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="composer" id="chatForm">
    <label for="q" style="position:absolute;left:-9999px">Message</label>
    <textarea id="q" rows="1" maxlength="1000" placeholder="Message FoydaPay…"></textarea>
    <button class="primary" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</section>

</main>

<nav aria-label="Main">
  <button data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-go="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Check</button>
  <button data-go="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chat</button>
</nav>
</div>

<script>
'use strict';
/* ================= basics ================= */
let SID = null, STATE = null, PLAN = null, LLM = false;
const $ = id => document.getElementById(id);
const spaced = n => n ? String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : '';
const fmt = n => (Math.round(n) < 0 ? '−' : '') + (spaced(Math.abs(n)) || '0') + ' UZS';
const digits = v => parseInt(String(v).replace(/[^\d]/g, '').slice(0, 12) || '0', 10);
const store = {
  get(k, d){ try { const v = localStorage.getItem('fp_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('fp_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem('fp_' + k); } catch (e) {} },
};
function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(k => k != null && k !== false && e.append(k.nodeType ? k : document.createTextNode(k)));
  return e;
}
// replaceChildren() would print null/false as text, so skip them
const fill = (node, ...kids) => node.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
const svg = d => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.innerHTML = d; return s; };
const ICON = {
  plan: '<path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  alert: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M12 8v5M12 16h.01"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
};
async function api(path, body){
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const msg = typeof d.detail === 'string' ? d.detail : Array.isArray(d.detail) && d.detail[0] ? String(d.detail[0].msg).replace(/^Value error, /, '') : 'Please check the numbers and try again.';
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return d;
}
function toast(text){ const t = el('div', { class: 'toast', role: 'status', text }); document.body.append(t); setTimeout(() => t.remove(), 4500); }
const hasProfile = () => !!(STATE && STATE.custom);

/* ================= dates ================= */
const DAY = 864e5, WD = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayOf = (y, m, day) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
const nice = d => `${d.getDate()} ${MON[d.getMonth()]}`;

/* ================= navigation ================= */
const NAV_OF = { plan: 'check', calendar: 'home', security: 'home' };
function go(tab){
  if (tab === 'check' && PLAN && hasProfile() && !go.editing) tab = 'plan';
  go.editing = false;
  document.querySelectorAll('section[data-tab]').forEach(s => s.hidden = s.dataset.tab !== tab);
  const navTab = NAV_OF[tab] || tab;
  document.querySelectorAll('nav button').forEach(b => b.dataset.go === navTab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  ({ home: renderHome, plan: renderPlan, calendar: renderCalendar, security: renderSecurity, chat: renderChat, check: renderStep })[tab]();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
const topbar = title => el('div', { class: 'topbar' },
  el('button', { class: 'icon', 'aria-label': 'Back to Home', onclick: () => go('home') }, svg(ICON.back)), el('h2', { text: title }));
function tile(icon, cls, title, sub, onclick){
  return el('button', { class: 'tile', onclick }, el('span', { class: 'ic ' + cls }, svg(icon)),

function jobShifts(){
  if (!PLAN) return [];
  const slotOf = Object.fromEntries(PLAN.earn.plan.map(j => [j.gig_id, j.slot]));
  const items = STATE.booked.length ? STATE.booked.map(b => ({ ...b, slot: slotOf[b.gig_id] || 'flexible', kind: 'job' }))
    : PLAN.earn.plan.map(j => ({ ...j, kind: 'planned' }));
  const alt = (P.formats || []).find(f => f.startsWith('alternate'));
  const fits = (slot, d) => {
    const w = d.getDay();
    if (slot === 'weekend') return w === 0 || w === 6;
    if (slot === 'evening') return w >= 1 && w <= 5;
    if (slot === 'day') return alt ? (d.getDate() % 2 === (alt === 'alternate_even' ? 0 : 1)) : w >= 1 && w <= 5;
    if (slot === 'night') return w === 5 || w === 6 || w === 3;
    return w !== 0;
  };
  const used = new Set(), out = [];
  for (const j of items) {
    let left = j.shifts, last = 0;
    for (let i = 1; i <= 60 && left > 0; i++) {
      const d = addDays(today(), i);
      if (used.has(iso(d)) || !fits(j.slot, d) || (j.slot === 'online' || j.slot === 'flexible') && last && i - last < 2) continue;
      used.add(iso(d)); left--; last = i;
      out.push({ date: d, kind: j.kind, title: (j.kind === 'planned' ? 'Planned: ' : '') + j.title.split(' - ')[0], sub: j.title.split(' - ')[1] || '', amount: j.earns / j.shifts });
    }

}

  reminders().forEach(r => {

function suggestions(){
  if (!PLAN) return ['What can you do?', 'Is this SMS a scam?'];
  return PLAN.shortfall > 0 ? ['What should I do first?', "Qarzimni qanday tezroq yopaman?", 'Сколько я могу сэкономить?'] : ['How can I pay my loans off faster?', 'Где я трачу больше всего?'];
}
function renderChat(){
  const box = $('msgs'), c = curChat();
  fill(box, );
  $('chatForm').hidden = !hasProfile();
  if (!hasProfile()) {
    box.append(bubble({ role: 'assistant', text: "Hi! I'm FoydaPay, your AI money assistant. To give advice with real numbers I need your quick check first: 5 short steps." }),
      el('button', { class: 'primary', text: 'Start my check', 'data-go': 'check' }));
    return;
  }
  box.append(bubble({ role: 'assistant', text: `Hi ${STATE.name}! I can see your loans, spending and plan. Ask me anything. I only act after you press Confirm, and I never send money to new cards.` }));
  (c ? c.msgs : []).forEach(m => box.append(bubble(m)));
  if (!c || !c.msgs.length) box.append(el('div', { class: 'row wrap' }, suggestions().slice(0, 3).map(t => el('button', { class: 'chip', text: t, onclick: () => sendChat(t) }))));
  box.lastChild.scrollIntoView({ block: 'end' });
}
function actionCard(ev){
  const ok = el('button', { class: 'primary', text: 'Confirm' }), no = el('button', { class: 'ghost', text: 'Cancel' });
  const card = el('div', { class: 'actioncard' }, el('p', { class: 'tier', text: 'NEEDS YOUR CONFIRMATION' }), el('b', { text: ev.summary }),
    el('ul', { class: 'list' }, ev.details.map(d => el('li', {}, el('span', { text: d })))), el('div', { class: 'row' }, ok, no));
  const decide = async approve => {
    ok.disabled = no.disabled = true;
    try { const r = await api('/api/confirm', { session_id: SID, confirmation_id: ev.id, approve }); STATE = r.state; card.replaceWith(el('p', { class: 'muted small', text: approve ? '✓ Confirmed' : 'Cancelled' })); pushMsg('assistant', r.reply); }
    catch (e) { toast(e.message); ok.disabled = no.disabled = false; }
  };
  ok.onclick = () => decide(true); no.onclick = () => decide(false);
  return el('div', { class: 'mrow agent' }, el('div', { class: 'avatar sm', 'aria-hidden': 'true', text: 'F' }), card);
}
function pushMsg(role, text){
  let c = curChat();
  if (!c) { c = { id: 'c' + Date.now().toString(36), created: Date.now(), title: '', msgs: [] }; CHATS.push(c); CUR = c.id; }
  if (!c.title && role === 'user') c.title = text.slice(0, 48);
  const m = { role, text, t: Date.now() };
  c.msgs.push(m); saveChats();
  const box = $('msgs'); box.querySelectorAll('.row.wrap').forEach(x => x.remove());
  const b = bubble(m); box.append(b); b.scrollIntoView({ block: 'end' });
}
async function sendChat(text){
  text = text.trim(); if (!text || BUSY) return;
  BUSY = true; pushMsg('user', text);
  const typing = el('div', { class: 'mrow agent' }, el('div', { class: 'avatar sm', 'aria-hidden': 'true', text: 'F' }), el('div', { class: 'msg typing', 'aria-label': 'FoydaPay is typing' }, el('i'), el('i'), el('i')));
  $('msgs').append(typing); typing.scrollIntoView({ block: 'end' });
  try {
    const r = await api('/api/chat', { session_id: SID, message: text });
    typing.remove(); STATE = r.state; pushMsg('assistant', r.reply);
    (r.events || []).forEach(ev => { if (ev.type === 'confirm') { const a = actionCard(ev); $('msgs').append(a); a.scrollIntoView({ block: 'end' }); } });
  } catch (e) {
    typing.remove();
    if (e.status === 404) { await reconnect(); pushMsg('assistant', 'I reconnected to your account. Please send that again.'); }
    else pushMsg('assistant', e.message);
  }
  BUSY = false;
}
async function openChat(id){
  CUR = id; saveChats();
  const c = curChat();
  try { await api('/api/chat/reset', { session_id: SID, history: c ? c.msgs.slice(-40).map(m => ({ role: m.role, text: m.text.slice(0, 4000) })) : [] }); } catch (e) {}
  renderChat();
}
$('newChatBtn').onclick = () => { CUR = null; saveChats(); openChat(null); };
$('histBtn').onclick = () => {
  const list = [...CHATS].reverse();
  const w = sheet([el('div', { class: 'row between' }, el('h3', { text: 'Your chats' }), el('button', { class: 'link', text: '+ New chat', onclick: () => { w.remove(); $('newChatBtn').click(); } })),
    list.length ? el('ul', { class: 'list' }, list.map(c => el('li', {},
      el('button', { class: 'link', style: 'text-align:left;font-weight:500;color:var(--text)', onclick: () => { w.remove(); openChat(c.id); } },
        el('span', { text: c.title || 'New chat' }), el('br'), el('span', { class: 'muted small', text: `${nice(new Date(c.created))} · ${c.msgs.length} messages` })),
      el('button', { class: 'link small', 'aria-label': 'Delete chat', text: 'Delete', onclick: () => { CHATS = CHATS.filter(x => x.id !== c.id); if (CUR === c.id) CUR = null; saveChats(); w.remove(); $('histBtn').click(); renderChat(); } }))))
      : el('p', { class: 'muted', text: 'No chats yet.' }),
    el('p', { class: 'muted small', text: 'Chats are saved only on this phone.' })]);
};
$('chatForm').addEventListener('submit', e => { e.preventDefault(); const v = $('q').value; $('q').value = ''; $('q').style.height = ''; sendChat(v); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('chatForm').requestSubmit(); } });
$('q').addEventListener('input', () => { const q = $('q'); q.style.height = 'auto'; q.style.height = Math.min(140, q.scrollHeight) + 'px'; });

/* ================= start ================= */
async function reconnect(){
  const r = await api('/api/session', {}); SID = r.session_id; STATE = r.state; store.set('sid', SID);
  if (store.get('profile', null)) { await sendProfile(); if (CUR) await openChat(CUR); }
}
(async () => {
  renderHome();
  try {
    const h = await api('/healthz');
    LLM = h.mode === 'llm';
    $('modeBadge').textContent = LLM ? 'online · AI agent' : 'online · offline mode (rules)';
    const sid = store.get('sid', null);
    let alive = false;
    if (sid) { try { STATE = await api('/api/state?session_id=' + encodeURIComponent(sid)); SID = sid; alive = true; } catch (e) {} }
    if (alive && STATE.custom) { const r = await api('/api/action', { session_id: SID, tool: 'build_rescue_plan', args: {} }); PLAN = r.result.result; STATE = r.state; }
    else await reconnect();
  } catch (e) { fill($('home'), el('p', { class: 'muted', text: 'Could not connect: ' + e.message })); return; }
  go('home');
  if (!store.get('seen_guide', 0)) showGuide();
  checkReminders(); setInterval(checkReminders, 30000);
})();
</script>
